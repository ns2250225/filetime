[package]
name = "filetime"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[features]
bundled-shell = []

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["clock"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sha1 = "0.10"
similar = "2"
slint = "1.12"
tempfile = "3"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
uuid = { version = "1", features = ["v4"] }
windows-sys = { version = "0.59", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Registry", "Win32_System_Threading", "Win32_Security", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[build-dependencies]
slint-build = "1.12"
winresource = "0.1"
